name: Weekly PP1875 Update

on:
  schedule:
    - cron: '47 6 * * 1'      # 06:47 UTC = 09:47 МСК, понедельник (слот ПП 1875 из §3.2)
  workflow_dispatch:          # ручной запуск

jobs:
  sync-and-trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # Kaggle CLI >= 1.8.0 читает KAGGLE_API_TOKEN напрямую.
      # В репозитории prog815/okpd2-pp1875 секрет называется KAGGLE_API_TOKEN_PP1875,
      # внутри — чистый токен (gha-pp1875). Внутри workflow — KAGGLE_API_TOKEN.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN_PP1875 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Kaggle CLI (>= 1.8.0)
        run: |
          pip install -q --upgrade kaggle
          kaggle --version
          python - <<'EOF'
          import re, subprocess
          out = subprocess.check_output(["kaggle", "--version"], text=True).strip()
          m = re.search(r"(\d+)\.(\d+)", out)
          assert m and tuple(map(int, m.groups())) >= (1, 8), \
              f"нужен kaggle CLI >= 1.8.0 для API-токенов, получен: {out}"
          print("OK: kaggle CLI >= 1.8.0")
          EOF

      - name: Download latest kernel output
        run: |
          mkdir -p ./output
          kaggle kernels output eavprog/pp1875-natsrezhim-downloader -p ./output || true
          echo "Содержимое output:"
          find ./output -maxdepth 4 -type f | head -40
          echo ""
          echo "--- диагностика тетрадки (если есть) ---"
          for f in ./output/pp1875_data/final/validation_report.json ./output/pp1875_data/diag/pp1875_diagnostics.json ./output/*.log ./output/*.txt; do
            [ -f "$f" ] && { echo ">>> $f (last 50 lines) >>>"; tail -n 50 "$f"; echo "<<< $f <<<"; echo ""; }
          done || true

      - name: Detect SRC and copy web files (.gz only)
        id: copy
        run: |
          # Авто-детект по §3.1: pp1875_data/web (стандарт) → web (фоллбэк).
          # Публикуются ТОЛЬКО .gz (fallback .json убран, §2.10).
          SRC=""
          for cand in "./output/pp1875_data/web" "./output/web"; do
            if [ -f "$cand/pp1875.json.gz" ]; then
              SRC="$cand"
              break
            fi
          done
          if [ -z "$SRC" ]; then
            echo "::warning::pp1875.json.gz не найден ни в ./output/pp1875_data/web, ни в ./output/web"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "SRC=$SRC"
          MISSING=0
          # ПП 1875 — производный справочник: 3 .gz (данные ОКПД2 + реестр приложений + мета).
          for f in pp1875.json.gz pp1875_ref.json.gz pp1875_meta.json.gz; do
            if [ -f "$SRC/$f" ]; then
              cp "$SRC/$f" "./$f"
              echo "copied $f ($(stat -c%s "$SRC/$f") bytes)"
            else
              echo "::warning::MISSING $f в $SRC (тетрадка, вероятно, упала)"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ Отсутствует $MISSING из 3 .gz файлов — коммит пропущен, сайт остаётся на последней хорошей версии"
            echo "FILES_OK=false" >> "$GITHUB_ENV"
          else
            echo "✅ Все 3 .gz файла на месте"
            echo "FILES_OK=true" >> "$GITHUB_ENV"
          fi

      - name: Check metadata (META_OK)
        id: meta
        if: env.FILES_OK == 'true'
        run: |
          python - <<'EOF'
          import gzip, hashlib, json, os, re

          with gzip.open("pp1875_meta.json.gz", "rt", encoding="utf-8") as f:
              m = json.load(f)

          ok = True
          reasons = []

          # 1. publish_allowed
          if m.get("publish_allowed") is not True:
              ok = False
              reasons.append(f"publish_allowed={m.get('publish_allowed')}")

          # 2. critical_errors
          ce = m.get("critical_errors")
          if ce:
              ok = False
              reasons.append(f"critical_errors={ce}")

          # 3. records_count > 0
          rc = m.get("records_count")
          if not isinstance(rc, int) or rc <= 0:
              ok = False
              reasons.append(f"records_count={rc}")

          # 4. data_hash_full — 64 hex-символа
          declared_full = m.get("data_hash_full") or ""
          declared_short = m.get("data_hash") or ""
          if not declared_full:
              ok = False
              reasons.append("data_hash_full отсутствует в мете")
          elif not re.fullmatch(r"[0-9a-f]{64}", str(declared_full)):
              ok = False
              reasons.append(f"data_hash_full невалидный: {declared_full}")

          # 5. data_hash == data_hash_full[:16] (§3.1) — блокирует
          if declared_short and declared_full and declared_short != declared_full[:16]:
              ok = False
              reasons.append(
                  f"data_hash != data_hash_full[:16]: short={declared_short} full_prefix={declared_full[:16]}"
              )

          # 6. Информационная сверка sha256(pp1875.json.gz) с data_hash_full — НЕ блокирует.
          #    Семантика data_hash_full в ПП 1875 пока не подтверждена окончательно,
          #    поэтому выводим только warning.
          if declared_full:
              try:
                  with gzip.open("pp1875.json.gz", "rb") as f:
                      content = f.read()
                  actual_full = hashlib.sha256(content).hexdigest()
                  if declared_full == actual_full:
                      print(f"✓ sha256(pp1875.json) == data_hash_full ({actual_full[:16]}…)")
                  else:
                      print(f"  ⚠ sha256(pp1875.json)={actual_full[:16]}… != data_hash_full={declared_full[:16]}… (информационно, не блокирует)")
              except Exception as e:
                  print(f"  ⚠ не удалось сверить sha256(pp1875.json): {e}")

          # Информационная статистика для лога
          print(f"source_date:        {m.get('source_date')}")
          print(f"change_display:     {m.get('change_display')}")
          print(f"records_count:      {m.get('records_count')}")
          print(f"ref_records_count:  {m.get('ref_records_count')}")
          print(f"leaf_count:         {m.get('leaf_count')}")
          print(f"warnings:           {m.get('warnings')}")

          if ok:
              print("✓ META_OK: publish_allowed=true, critical_errors=[], records_count>0, data_hash == data_hash_full[:16]")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("META_OK=true\n")
          else:
              print("::error::Мета не прошла проверку:")
              for r in reasons:
                  print(f"  - {r}")
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("META_OK=false\n")
          EOF

      - name: Delete old .json files (cleanup legacy)
        if: env.FILES_OK == 'true' && env.META_OK == 'true'
        run: |
          git rm --ignore-unmatch pp1875.json pp1875_ref.json pp1875_meta.json || true

      - name: Commit and push changes
        if: env.FILES_OK == 'true' && env.META_OK == 'true'
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "GitHub Actions"
          # Добавляем только .gz файлы, как того требует стандарт
          git add pp1875.json.gz pp1875_ref.json.gz pp1875_meta.json.gz

          if git diff --cached --quiet; then
            echo "✅ Изменений нет — данные уже актуальны"
          else
            # SOURCE_DATE через gzip -d -c | python -c (без heredoc).
            # Цепочка по §3.1: source_date → effective_date → prepared_date → generated_at → '?'.
            # ПП 1875-специфика: source_date в мете — дата редакции Кодекса (2026-10-17),
            # change_display = "Редакция от 17 октября 2026 года" (не null, в отличие от ОКПД2).
            # Коммит создаётся ТОЛЬКО при реальном изменении .gz (git diff --cached --quiet),
            # поэтому нестабильная дата не даёт лишнего шума — коммиты редки и осмысленны.
            SOURCE_DATE=$(gzip -d -c pp1875_meta.json.gz | python -c "import sys, json; m=json.load(sys.stdin); print(m.get('source_date') or m.get('effective_date') or m.get('prepared_date') or m.get('generated_at') or '?')")
            git commit -m "Auto-update: pp1875 data (source ${SOURCE_DATE}) [skip ci]"
            git push
            echo "✅ Изменения запушены (source=${SOURCE_DATE})"
          fi

      - name: Trigger new notebook run (fire-and-forget, always)
        if: always()
        run: |
          mkdir -p ./nb
          kaggle kernels pull eavprog/pp1875-natsrezhim-downloader -p ./nb --metadata
          kaggle kernels push -p ./nb
          echo "✅ Тетрадка перезапущена (round-trip); workflow не ждёт её завершения"
